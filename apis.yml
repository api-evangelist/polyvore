name: Polyvore
description: 'Polyvore was a community-powered fashion and lifestyle social-commerce
  website where members created and shared outfit "sets" by clipping product images
  into collages. Founded in 2007 and backed by Matrix Partners, it was acquired by
  Yahoo in 2015 (~$200M), passed to Verizon/Oath, and its assets were acquired by
  Canadian e-commerce retailer SSENSE in April 2018, which shut the site down immediately.
  The polyvore.com domain now 301-redirects to ssense.com; there is no live product,
  developer portal, or public API surface. This profile is retained as a historical
  portfolio-company record.'
